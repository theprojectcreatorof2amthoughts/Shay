name: Shay CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build and run regression suite with Make
        run: make test
      - name: Build with CMake
        run: cmake -S . -B build-cmake && cmake --build build-cmake --parallel
      - name: Run CTest suite
        run: ctest --test-dir build-cmake --output-on-failure

  windows-native-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure Windows build
        run: cmake -S . -B build-windows -A x64
      - name: Build Windows compiler and interpreter targets
        run: cmake --build build-windows --config Release --parallel
      - name: Build and exercise the self-contained PyInit package
        shell: pwsh
        run: |
          Copy-Item build-windows\Release\shentrypak.exe pytool\shentrypak.exe -Force
          cmd /c pytool\build.bat
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:HOME = $env:USERPROFILE
          $output = "Yamen" | & .\build-windows\Release\shaii.exe .\pytool\test.shay
          if ($LASTEXITCODE -ne 0) { throw "shaii failed while running PyInit test" }
          $actual = ($output -join "`n").TrimEnd()
          $expected = @("Before Shay", "42", "Name: Hello Yamen", "Back in Shay", "43") -join "`n"
          if ($actual -ne $expected) { throw "Unexpected PyInit output: `n$actual" }
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build and exercise generated Windows SHUI application
        shell: pwsh
        run: |
          $env:CXX = "cl"
          & .\build-windows\Release\gshai.exe -o build-windows\windows-demo examples\windows-demo.shui
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build build-windows\windows-demo.csproj --nologo --verbosity quiet
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $source = Get-Content build-windows\windows-demo.cs -Raw
          $token = [regex]::Match($source, 'private const string ShayToken = "([^"]+)"').Groups[1].Value
          if (-not $token) { throw "Generated Windows UI did not contain its runtime token" }
          $runtime = Start-Process -FilePath (Resolve-Path build-windows\windows-demo.exe) -PassThru -WindowStyle Hidden
          try {
            $ready = $false
            for ($i = 0; $i -lt 30; $i++) {
              try {
                Invoke-WebRequest -UseBasicParsing "http://127.0.0.1:18765/state?token=$token" | Out-Null
                $ready = $true
                break
              } catch { Start-Sleep -Milliseconds 100 }
            }
            if (-not $ready) { throw "Windows Shay runtime bridge did not start" }
            Invoke-WebRequest -UseBasicParsing -Method Post -ContentType "text/plain" -Body "$token|displayName=CI" "http://127.0.0.1:18765/set" | Out-Null
            $event = Invoke-WebRequest -UseBasicParsing -Method Post -ContentType "text/plain" -Body "$token|doCalc" "http://127.0.0.1:18765/event"
            if ($event.Content.Trim() -ne "CI") { throw "Windows UI event did not execute Shay method: $($event.Content)" }
          } finally {
            Stop-Process -Id $runtime.Id -Force -ErrorAction SilentlyContinue
          }
